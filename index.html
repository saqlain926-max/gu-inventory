<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GU Inventory">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>GU Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Archivo,Inter,system-ui,sans-serif;background:#f6f7f9;color:#111;line-height:1.4}
  .wrap{max-width:1040px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
  h1{font-size:22px;font-weight:800;color:#002D62;letter-spacing:-.01em}
  .sub{color:#6b7280;font-size:14px;margin-top:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px}
  .card h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}
  label:first-of-type{margin-top:0}
  input,textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#111;outline:none}
  input:focus,textarea:focus,select:focus{border-color:#002D62;box-shadow:0 0 0 3px rgba(17,17,17,.08)}
  textarea{resize:vertical;min-height:70px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row label{margin-top:14px}
  .drop{border:1.5px dashed #d1d5db;border-radius:12px;height:190px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;cursor:pointer;color:#6b7280;font-size:14px;overflow:hidden;position:relative;background:#fafafa;transition:border-color .15s}
  .drop:hover,.drop.over{border-color:#111}
  .drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
  .drop svg{width:30px;height:30px;stroke:#9ca3af}
  .drop .hint{font-size:12px;color:#9ca3af}
  .imgbtns{display:flex;gap:8px;margin-top:8px}
  .btn{font:inherit;font-size:14px;font-weight:600;border-radius:9px;padding:11px 16px;cursor:pointer;border:1px solid #002D62;background:#002D62;color:#fff;transition:opacity .15s}
  .btn:hover{opacity:.85}
  .btn.ghost{background:#fff;color:#111;border-color:#d1d5db}
  .btn.small{padding:7px 12px;font-size:13px}
  .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .actions .btn{flex:1}
  #preview{width:100%;height:auto;border:1px solid #e5e7eb;border-radius:10px;display:block;background:#fff}
  .msg{font-size:13px;margin-top:12px;min-height:18px;color:#6b7280}
  .msg.ok{color:#15803d}.msg.err{color:#b91c1c}
  .req{color:#b91c1c}
  input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <img src="logo40.png" alt="Greenwich University — 40 Years of Excellence" style="height:84px;width:auto;display:block;margin-bottom:14px">
  <h1>Inventory Handover Form</h1>
  <p class="sub">Add the product photo, who it went to, then save the slip as an image.</p>

  <div class="grid">
    <form class="card" id="form" autocomplete="off">
      <h2>Product</h2>
      <div class="drop" id="drop">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Add product photo</span>
        <span class="hint">Use the buttons below</span>
        <img id="thumb" alt="" hidden>
      </div>
      <div class="imgbtns">
        <button type="button" class="btn ghost small" id="camBtn" style="flex:1">📷 Camera</button>
        <button type="button" class="btn ghost small" id="galBtn" style="flex:1">🖼️ Gallery</button>
        <button type="button" class="btn ghost small" id="removeImg" hidden>Remove</button>
      </div>
      <input type="file" id="cam" accept="image/*" capture="environment">
      <input type="file" id="file" accept="image/*">

      <label for="product" style="margin-top:16px">Product name <span class="req">*</span></label>
      <input id="product" placeholder="e.g. Dell Laptop Latitude 5420">
      <div class="row">
        <div><label for="qty">Quantity</label><input id="qty" type="number" min="1" value="1"></div>
        <div><label for="code">Serial / Item code</label><input id="code" placeholder="Optional"></div>
      </div>
      <label for="condition">Condition</label>
      <select id="condition"><option>New</option><option>Good</option><option>Used</option><option>Needs repair</option></select>

      <h2 style="margin-top:24px">Given to</h2>
      <label for="to">Name <span class="req">*</span></label>
      <input id="to" placeholder="Who received it">
      <div class="row">
        <div><label for="dept">Department</label><input id="dept" placeholder="Optional"></div>
        <div><label for="phone">Contact</label><input id="phone" placeholder="Optional"></div>
      </div>
      <div class="row">
        <div><label for="by">Given by</label><input id="by" placeholder="Your name"></div>
        <div><label for="date">Date</label><input id="date" type="date"></div>
      </div>
      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Return date, purpose, accessories included…"></textarea>

      <div class="actions">
        <button type="button" class="btn ghost" id="reset">Clear</button>
        <button type="button" class="btn" id="save">Save as image</button>
      </div>
      <div class="msg" id="msg"></div>
    </form>

    <div class="card">
      <h2>Slip preview</h2>
      <img id="preview" alt="Slip preview">
      <p class="msg" id="fallback" hidden>Tip: you can also long-press the slip and choose “Save image”.</p>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fields = ['product','qty','code','condition','to','dept','phone','by','date','notes'];
let photo = null;          // HTMLImageElement
let slipNo = newSlipNo();
let downloads = null;
const logo = new Image();
logo.onload = () => render();
logo.src = 'logo40.png';

function newSlipNo(){
  const d = new Date();
  return 'INV-' + d.getFullYear().toString().slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '-' + Math.floor(1000 + Math.random()*9000);
}
function today(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
$('date').value = today();
try { const b = localStorage.getItem('inv_by'); if (b) $('by').value = b; } catch(e){}

/* ---------- photo ---------- */
$('drop').addEventListener('click', () => $('file').click());
$('camBtn').addEventListener('click', () => $('cam').click());
$('galBtn').addEventListener('click', () => $('file').click());
$('removeImg').addEventListener('click', () => { photo = null; $('thumb').hidden = true; $('removeImg').hidden = true; $('file').value=''; $('cam').value=''; render(); });
['file','cam'].forEach(id => $(id).addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); }));
['dragover','dragenter'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) loadFile(f); });

function loadFile(file){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => { photo = shrink(img); $('thumb').src = r.result; $('thumb').hidden = false; $('removeImg').hidden = false; render(); };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function shrink(img){
  const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
  if (k === 1) return img;
  const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c;
}
/* ---------- canvas slip ---------- */
const W = 1080, PAD = 64;
function val(id){ return $(id).value.trim(); }
function fmtDate(s){
  if (!s) return '—';
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function wrap(ctx, text, maxW){
  const words = text.split(/\s+/); const lines = []; let line = '';
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines.flatMap(l => { const out=[]; let cur=''; for (const ch of l){ if (ctx.measureText(cur+ch).width > maxW && cur){ out.push(cur); cur=ch; } else cur+=ch; } out.push(cur); return out; });
}

function drawSlip(){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const F = 'Archivo, Inter, system-ui, sans-serif';
  const colW = (W - PAD*2 - 40) / 2;
  const LH = 40;
  const now = new Date();

  // all details, always shown
  const pairs = [
    ['PRODUCT', val('product') || '—', 'QUANTITY', val('qty') || '1'],
    ['SERIAL / ITEM CODE', val('code') || '—', 'CONDITION', val('condition')],
    ['GIVEN TO', val('to') || '—', 'DEPARTMENT', val('dept') || '—'],
    ['CONTACT', val('phone') || '—', 'GIVEN BY', val('by') || '—'],
    ['DATE GIVEN', fmtDate(val('date')), 'SLIP NUMBER', slipNo],
  ];
  ctx.font = `600 30px ${F}`;
  const rows = pairs.map(([l1,v1,l2,v2]) => {
    const a = wrap(ctx, v1, colW), b = wrap(ctx, v2, colW);
    return { l1, a, l2, b, h: 34 + Math.max(a.length, b.length) * LH + 34 };
  });
  ctx.font = `400 28px ${F}`;
  const notes = val('notes');
  const noteLines = notes ? notes.split('\n').flatMap(p => p ? wrap(ctx, p, W - PAD*2) : ['']) : ['—'];

  const logoW = 420, logoH = logo && logo.width ? logo.height * logoW / logo.width : 0;
  const headH = 40 + logoH + 40 + 50 + 44 + 40;
  const imgH = 520;
  const H = 12 + headH + 30 + imgH + 50 + rows.reduce((t,r) => t + r.h, 0) + 34 + noteLines.length * 40 + 40 + 200;
  c.width = W; c.height = H;

  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#C41E3A'; ctx.fillRect(0,0,W,12);

  // header: logo + title
  let y = 12 + 40;
  if (logoH){ ctx.drawImage(logo, (W - logoW)/2, y, logoW, logoH); }
  y += logoH + 40 + 46;
  ctx.textAlign = 'center'; ctx.fillStyle = '#002D62'; ctx.font = `800 46px ${F}`;
  ctx.fillText('Inventory Handover Slip', W/2, y);
  y += 44;
  ctx.fillStyle = '#5C6774'; ctx.font = `500 24px ${F}`;
  ctx.fillText(slipNo + '   ·   ' + fmtDate(val('date')) + '   ·   ' + now.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}), W/2, y);
  ctx.textAlign = 'left';
  y += 40;
  line(ctx, y);

  // photo
  y += 30;
  const boxW = W - PAD*2;
  ctx.fillStyle = '#F0F2F5'; roundRect(ctx, PAD, y, boxW, imgH, 18); ctx.fill();
  if (photo){
    const s = Math.min(boxW / photo.width, imgH / photo.height);
    const w = photo.width * s, h = photo.height * s;
    ctx.save(); roundRect(ctx, PAD, y, boxW, imgH, 18); ctx.clip();
    ctx.drawImage(photo, PAD + (boxW - w)/2, y + (imgH - h)/2, w, h);
    ctx.restore();
  } else {
    ctx.fillStyle = '#9ca3af'; ctx.font = `500 26px ${F}`; ctx.textAlign = 'center';
    ctx.fillText('No photo added', W/2, y + imgH/2 + 8); ctx.textAlign = 'left';
  }
  y += imgH + 50;

  // details
  for (const r of rows){
    const strong = r.l1 === 'GIVEN TO' || r.l1 === 'PRODUCT';
    field(ctx, F, PAD, y, r.l1, r.a, strong);
    field(ctx, F, PAD + colW + 40, y, r.l2, r.b, false);
    y += r.h;
  }
  ctx.fillStyle = '#5C6774'; ctx.font = `700 20px ${F}`; ctx.fillText('NOTES', PAD, y);
  y += 44; ctx.fillStyle = '#111'; ctx.font = `400 28px ${F}`;
  for (const l of noteLines){ ctx.fillText(l, PAD, y); y += 40; }

  // signatures
  y = H - 150;
  ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(PAD + colW, y); ctx.moveTo(PAD + colW + 40, y); ctx.lineTo(W - PAD, y); ctx.stroke();
  ctx.fillStyle = '#5C6774'; ctx.font = `500 20px ${F}`;
  ctx.fillText('Receiver signature' + (val('to') ? ' — ' + val('to') : ''), PAD, y + 34);
  ctx.fillText('Issued by' + (val('by') ? ' — ' + val('by') : ''), PAD + colW + 40, y + 34);

  ctx.fillStyle = '#9ca3af'; ctx.font = `400 18px ${F}`; ctx.textAlign = 'center';
  ctx.fillText('Greenwich University  ·  Generated ' + now.toLocaleString('en-GB'), W/2, H - 34);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#C41E3A'; ctx.fillRect(0, H - 8, W, 8);
  return c;
}
function line(ctx, y){ ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W-PAD, y); ctx.stroke(); }
function field(ctx, F, x, y, label, lines, strong){
  ctx.fillStyle = '#5C6774'; ctx.font = `700 20px ${F}`; ctx.fillText(label, x, y);
  ctx.fillStyle = strong ? '#002D62' : '#111'; ctx.font = `${strong ? 800 : 600} 30px ${F}`;
  lines.forEach((l, i) => ctx.fillText(l, x, y + 44 + i*40));
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

let t;
let readyBlob = null, previewUrl = null;
function render(){ clearTimeout(t); t = setTimeout(() => {
  const c = drawSlip();
  c.toBlob(b => { readyBlob = b; if (previewUrl) URL.revokeObjectURL(previewUrl); previewUrl = URL.createObjectURL(b); $('preview').src = previewUrl; }, 'image/png');
}, 120); }
fields.forEach(id => $(id).addEventListener('input', render));
document.fonts && document.fonts.ready.then(render);
render();

/* ---------- save ---------- */
function setMsg(text, cls){ const m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || ''); }

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = isIOS || /Android/i.test(navigator.userAgent);
if (isMobile) $('save').textContent = 'Save to Gallery';

function fileName(){
  const safe = s => s.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,40);
  return `${slipNo}_${safe(val('product'))}_${safe(val('to'))}.png`;
}
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

$('save').addEventListener('click', async () => {
  if (!val('product') || !val('to')){ setMsg('Please fill in the product name and who you gave it to.', 'err'); return; }
  if (!readyBlob){ setMsg('One moment, preparing the slip…', ''); render(); return; }
  try { localStorage.setItem('inv_by', val('by')); } catch(e){}
  const name = fileName();
  const file = new File([readyBlob], name, { type: 'image/png' });
  // iPhone: share sheet → "Save Image" puts it in Photos
  if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file] }); setMsg('Choose “Save Image” to put it in your Photos. ✓', 'ok'); }
    catch(e){ if (e.name !== 'AbortError'){ $('fallback').hidden = false; setMsg('Long-press the slip below and tap “Save to Photos”.', 'err'); } }
    return;
  }
  // Android / computer: download (shows in Gallery → Downloads on Android)
  try { download(readyBlob, name); setMsg('Saved ' + name + ' ✓ — check Gallery › Downloads.', 'ok'); }
  catch(e){ $('fallback').hidden = false; setMsg('Long-press the slip below to save it.', 'err'); }
});

$('reset').addEventListener('click', () => {
  ['product','code','to','dept','phone','notes'].forEach(id => $(id).value = '');
  $('qty').value = 1; $('condition').selectedIndex = 0; $('date').value = today();
  photo = null; $('thumb').hidden = true; $('removeImg').hidden = true; $('file').value = ''; $('cam').value = '';
  slipNo = newSlipNo(); setMsg(''); render();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
